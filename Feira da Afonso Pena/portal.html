    <body>
		
	
        <div id="map">
		
			<div id="container">
				<div id="left-sidebar" data-status="colapsed">
					<div class="header">
						Resultados
					</div>

					<div class="body">
					</div>

					<div class="footer">
					</div>
				</div>
				
				<div id="middle">
					<header>
						<div id="searchbar" data-status="colapsed">
							<div class="principal">
								<button id="btn-field" class="material-symbols-outlined" tabindex="0"><span>badge</span><span style="padding:10px">expand_more</span></button>
								<div id="imp-search">
									<input type="search" id="search-input" name="search" placeholder="Digite Aqui o feirante" tabindex="1" autocomplete="off">
									<div id="input-autocomplete"></div>
								</div>
								<button type="submit" id="search" class="material-symbols-outlined" tabindex="2"><span>search</span></button>
								<button id="clearSearch" style="display:none" class="material-symbols-outlined" tabindex="6">close</button>
							</div>
							<div class="secondary">
									<div id="tags-sector">
										<span class="placeholder">Filtrar por setor</span>
										<span class="item" style="display:none"></span>
									</div>
								<button type="submit" id="btn-sector" class="material-symbols-outlined" data-status="add" tabindex="3"><span>add</span></button>
							</div>
						</div>
						
						
						<div id="zoombox">
							<div class="item"><button id="zoom-in" class="material-symbols-outlined" tabindex="4">zoom_in</button></div>
							<div class="item"><button id="zoom-out"class="material-symbols-outlined" tabindex="5">zoom_out</button></div>
							<div class="item"><button id="center-map"class="material-symbols-outlined" tabindex="6">open_with</button></div>
							<div class="item"><button id="gps"class="material-symbols-outlined" tabindex="6">my_location</button></div>
						</div>
					</header>
					
					<footer>
						<div id="menulist" data-status="colapsed">
							<div id="menugroup" style="display:none">
								<div id="info" class="item" data-toggle="tooltip" data-status="" title="Sobre o App"><button class="material-symbols-outlined" tabindex="8">info</button></div>
								<div id="wc" class="item" data-toggle="tooltip" data-status="" title="Sanitários"><button class="material-symbols-outlined" tabindex="9">wc</button></div>
								<!-- <div id="vendorstreet" class="item" data-toggle="tooltip" data-status="" title="Ambulantes"><button class="material-symbols-outlined" tabindex="10">fastfood</button></div> -->
								<div id="police" class="item" data-toggle="tooltip" title="Pontos de Apoio da brigada profissional"><button class="material-symbols-outlined" tabindex="11">local_police</button></div>
							</div>
							<div id="btn-list"><button class="material-symbols-outlined" tabindex="7">menu</button></div>
						</div>
							
						<div id="bottom-bar">
							<div class="hamburger-bottom">
								<span class="material-symbols-outlined">apps</span>
							</div>
							<div class="prev" style="display:none">
								<span class="material-symbols-outlined" aria-hidden="true">navigate_before</span>
							</div>
							
							<div id="bottom-carrosel"></div>
							
							<div class="next" style="display:none">
								<span class="material-symbols-outlined" aria-hidden="true">navigate_next</span>
							</div>
						</div>
					</footer>	
				</div>

				<div id="right-sidebar" data-status="colapsed">
					<div class="header">
						Feirante
					</div>
					<div class="body"></div>
					<div class="footer"></div>
				</div>
				<div id="btn-clearroute" style="display:none">
					<button class="material-symbols-outlined" tabindex="7">wrong_location</button>
				</div>
                <div id="version"></div>

			</div>
		</div>
		
		
		<div id="fs-background" class="dark">
				<!-- onde fica os eventos de area e fundo para modal-->
		</div>
		
		<div id="dialog-message" class="modal-box">
			<div id="fields-search" data-type="">
			</div> 
		</div>
		
		<div id="wall-info">
		
		</div>
		
		<div id="configs">
			{{configs}}
		</div>
